# OpenLDAP de prueba. MEMBEROF se reemplaza al arrancar: con memberOf (flavor openldap) o sin
# él (flavor generic, que arma los grupos solo con member).
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/nis.schema
include /etc/ldap/schema/inetorgperson.schema

modulepath /usr/lib/ldap
moduleload back_mdb
#MEMBEROF moduleload memberof

pidfile /run/slapd/slapd.pid
TLSCACertificateFile /etc/ldap/tls/ca.crt
TLSCertificateFile /etc/ldap/tls/server.crt
TLSCertificateKeyFile /etc/ldap/tls/server.key

database mdb
maxsize 104857600
suffix "dc=kudawiki,dc=test"
rootdn "cn=admin,dc=kudawiki,dc=test"
rootpw ROOTPW
directory /var/lib/ldap
index objectClass,uid,mail,member eq

#MEMBEROF overlay memberof
#MEMBEROF memberof-group-oc groupOfNames
#MEMBEROF memberof-member-ad member
#MEMBEROF memberof-memberof-ad memberOf

# La cuenta de servicio solo lee; nadie lee contraseñas.
access to attrs=userPassword
  by self write
  by anonymous auth
  by * none
access to *
  by dn.exact="cn=svc-kudawiki,dc=kudawiki,dc=test" read
  by self read
  by * none
