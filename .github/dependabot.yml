# Dependencias al día (SPEC §21.2.2): una revisión al mes, agrupada por ecosistema para que sea
# un solo PR que leer. Las actualizaciones de seguridad no esperan al mes: Dependabot las abre
# apenas sale el aviso (hay que tener activadas las "security updates" del repositorio).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ['*']

  # El ecosistema "npm" de Dependabot lee y actualiza pnpm-lock.yaml (solo pnpm, SPEC §15).
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      ui:
        patterns: ['*']
    # svelte-check todavía no corre con TypeScript 7 sin el modo --tsgo y TypeScript 6 al lado
    # (2026-11-03): se queda en la 6 hasta que lo soporte; entonces se borra esta regla.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']

  # Las acciones van fijadas por SHA; Dependabot sube el SHA y el comentario con la versión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Las imágenes base del Dockerfile, fijadas por digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
